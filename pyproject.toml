[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-novel-prompt"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.28,<3",
    "gradio>=4,<7",
    "json-repair>=0.30,<1",
    "pydantic>=2,<3",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
